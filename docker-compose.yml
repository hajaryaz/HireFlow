x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://admin:password@mysql:3306/job_intelligent
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    SELENIUM_URL: http://selenium:4444/wd/hub
    DB_HOST: mysql
    DB_PORT: 3306
    DB_NAME: job_intelligent
    DB_USER: admin
    DB_PASS: password
    FT_CLIENT_ID: ${FT_CLIENT_ID}
    FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scrapers:/opt/airflow/scrapers
    - ./logs:/opt/airflow/logs
  depends_on:
    mysql:
      condition: service_healthy
    selenium:
      condition: service_started
  networks:
    - job_net

services:

  mysql:
    image: mysql:8.0
    container_name: job_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: job_intelligent
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - job_net

  selenium:
    image: selenium/standalone-firefox:latest
    platform: linux/amd64
    container_name: job_selenium
    shm_size: '2gb'
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:

      SE_NODE_MAX_SESSIONS: 4
    networks:
      - job_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: job_api
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: job_intelligent
      DB_USER: admin
      DB_PASS: password
    ports:
      - "8083:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - job_net
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: job_airflow_init
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@jobintelligent.com
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: job_airflow_webserver
    command: webserver
    ports:
      - "8085:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: job_airflow_scheduler
    command: scheduler
    restart: always

volumes:
  mysql_data:

networks:
  job_net:
    driver: bridge